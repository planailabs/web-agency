[package]
name = "spaceship-api"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
rustls = { workspace = true }
