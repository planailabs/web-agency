[package]
name = "web-agency-upload"
version = "0.1.0"
edition = "2024"
description = "CLI tool to upload site folders to web-agency Cloudflare Pages webspaces"

[[bin]]
name = "web-agency-upload"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
anyhow = "1"
