# Agency chat: interactive chatbot in the web UI (floating bubble, bottom
# right). The agent's tools are the api-mcp endpoints (domains, webspaces,
# credentials, action templates, ...), dispatched with the chat user's
# permissions; tool calls at or above risk_threshold pause for approval in
# the chat sidebar. Off by default.
# [chat]
# enabled = true
# ollama_url = "http://localhost:11434"          # optional local provider
# anthropic_api_key = "sk-ant-xxx"               # optional cloud provider
# openrouter_api_key = "sk-or-xxx"               # optional cloud provider
# risk_threshold = "mutating"                    # "mutating" (default) | "destructive" | "never" (no approval gate)
# allow_approve_all = true                       # offer "approve all for this session" (default)
# token_budget = 500000                          # per-session token budget (0 = unlimited)
# max_active_sessions_per_user = 3               # concurrently running agents per user
# idle_park_minutes = 30                         # idle time before a session parks (resumes on next message)
# validator_provider = "ollama"                  # optional guard LLM checking each risky call
# validator_model = "gemma4"
# tools_include = []                             # tool-name globs to offer (empty = all, e.g. ["domain_*"])
# tools_exclude = []                             # tool-name globs to hide (e.g. ["*_delete"])
#
# Named OpenAI-compatible sources: api.openai.com, vLLM, LM Studio, ...
# Each name doubles as the provider string in [[models]] entries and must
# not be "ollama"/"anthropic"/"openrouter" or contain ':'. Add as many as
# needed.
# [[chat.openai]]
# name = "openai"                                # generic OpenAI
# url = "https://api.openai.com/v1"
# api_key = "sk-xxx"
# model = "gpt-4.1"                              # default when a request names none
# [[chat.openai]]
# name = "vllm"
# url = "http://my-vllm:8000/v1"                 # api_key optional for local servers
# model = "meta-llama/Llama-3.3-70B-Instruct"

# Unified model list for the chat model picker. If omitted, a small built-in
# Anthropic default list is used. Each entry: name (display label), model
# (provider identifier), provider ("ollama", "anthropic", "openrouter", or a
# [[chat.openai]] source name),
# optional token_budget override, optional input_cost_per_mtok /
# output_cost_per_mtok (USD per 1M tokens), and:
#   validator = true        # also offered as validator/guard model
#   validator_only = true   # hidden from regular model pickers
#   restrict = "chat"       # limit to chat types; string or list
# [[models]]
# name = "Claude Sonnet 4.6"
# model = "claude-sonnet-4-6"
# provider = "anthropic"
# token_budget = 200000
# input_cost_per_mtok = 3.0
# output_cost_per_mtok = 15.0
# [[models]]
# name = "Claude Haiku 4.5"
# model = "claude-haiku-4-5-20251001"
# provider = "anthropic"
# validator = true
