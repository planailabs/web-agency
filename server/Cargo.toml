[package]
name = "web-agency-server"
version = "0.1.0"
edition = "2024"

[features]
default = ["web", "server", "webui"]
web = ["webui", "dioxus/web"]
webui = ["dep:dioxus", "dep:wasm-bindgen", "dep:web-sys", "dep:dioxus-i18n", "dep:unic-langid", "dep:plan-ai-design", "dep:pulldown-cmark"]
server = ["webui", "dioxus/server", "dep:axum-oidc-client", "dep:axum-extra", "dep:percent-encoding", "dep:sqlx", "dep:tokio", "dep:sha2", "dep:hmac", "dep:hex", "dep:rand", "dep:tracing-subscriber", "dep:anyhow", "dep:toml", "dep:base64", "dep:reqwest", "dep:rustls", "dep:aes-gcm", "dep:thiserror", "dep:cloudflare-api", "dep:spaceship-api", "dep:async-trait", "dep:tempfile", "dep:rust-embed", "dep:instant-acme", "dep:rcgen", "dep:async-stream", "dep:futures-core", "dep:tar", "dep:flate2", "dep:prometheus", "plan-ai-auth/server"]

[dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"], optional = true }
plan-ai-design = { path = "../../plan-ai-design", optional = true }
wasm-bindgen = { version = "=0.2.114", optional = true }
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Event"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.9", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
axum-oidc-client = { version = "0.5", features = ["sql-cache-postgres", "redis"], optional = true }
percent-encoding = { version = "2", optional = true }
serde_json = "1"
base64 = { version = "0.22", optional = true }
axum-extra = { version = "0.10", features = ["cookie-private"], optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
dioxus-i18n = { version = "0.5", optional = true }
unic-langid = { version = "0.9", features = ["macros"], optional = true }
aes-gcm = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }
tempfile = { version = "3", optional = true }
pulldown-cmark = { version = "0.12", optional = true }
rust-embed = { version = "8", features = ["include-exclude"], optional = true }
thiserror = { version = "2", optional = true }
plan-ai-auth = { path = "../../plan-ai-auth" }
cloudflare-api = { path = "../cloudflare-api", optional = true }
spaceship-api = { path = "../spaceship-api", optional = true }
instant-acme = { version = "0.7", optional = true }
rcgen = { version = "0.13", optional = true }
async-stream = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
prometheus = { version = "0.13", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
