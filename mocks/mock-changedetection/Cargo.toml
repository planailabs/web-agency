[package]
name = "mock-changedetection"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
changedetection-api = { path = "../../changedetection-api" }
reqwest = { workspace = true }
rustls = { workspace = true }
