[workspace]
members = ["common", "common/plan-ai-actions", "common/plan-ai-api-mcp", "common/plan-ai-api-mcp-macros", "common/plan-ai-auth", "common/plan-ai-html", "changedetection-api", "cloudflare-api", "dataforseo-api", "mocks/mock-changedetection", "mocks/mock-cloudflare", "mocks/mock-spaceship", "proxy", "server", "spaceship-api", "upload-cli"]
# plan-ai-design is consumed by path (design/ submodule); mac-mgmt mirrors
# this with a design -> memvault/plan-ai-design symlink so
# common/plan-ai-actions' relative path dep resolves in both checkouts.
exclude = ["design"]
resolver = "3"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rmcp = { version = "0.17", default-features = false, features = ["server", "transport-io", "macros"] }

[patch.crates-io]
dioxus = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-server = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-i18n = { git = "https://github.com/mkg20001/dioxus-i18n.git", branch = "feat/dioxus-0.8" }
